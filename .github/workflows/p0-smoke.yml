name: P0 offline sanity
on:
  push:
    branches: [p0-protocol-audit, p0-r1-reproducibility, p0-r2-numerical-replay, e01-v22-initialization-audit, e02-matched-feedback-factorial, e02-r1-r2-probe-calibration]
  pull_request:
    paths:
      - 'experiments/p0_protocol_audit.py'
      - 'experiments/p0_v22_equivalence.py'
      - 'tests/test_e01_equivalence.py'
      - 'experiments/e02_matched_feedback.py'
      - 'tests/test_e02_matched_feedback.py'
      - 'experiments/e02_r1_r2.py'
      - 'tests/test_e02_r1_r2.py'
      - 'tests/test_p0_protocol_audit.py'
      - 'test_phase3_AIF_simplified_v22.py'
      - 'vmb_visionad_new.py'

jobs:
  syntax-and-numeric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy scikit-learn
      - name: Compile source and audit module
        run: python -m py_compile experiments/p0_protocol_audit.py test_phase3_AIF_simplified_v22.py vmb_visionad_new.py tests/test_p0_protocol_audit.py experiments/p0_v22_equivalence.py tests/test_e01_equivalence.py experiments/e02_matched_feedback.py tests/test_e02_matched_feedback.py experiments/e02_r1_r2.py tests/test_e02_r1_r2.py
      - name: P0-R1 numerical self-test
        run: python experiments/p0_protocol_audit.py --self-test
      - name: E01 offline self-test
        run: python experiments/p0_v22_equivalence.py --self-test
      - name: E02 offline self-test
        run: python experiments/e02_matched_feedback.py --self-test
      - name: E02-R1/R2 offline self-test
        run: python experiments/e02_r1_r2.py --self-test
      - name: Offline regressions
        run: python -m unittest discover -s tests -v
