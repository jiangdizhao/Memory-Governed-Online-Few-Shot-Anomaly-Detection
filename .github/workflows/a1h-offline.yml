name: A1-H offline protocol audit
on:
  push:
    branches:
      - a1h-hierarchical-memory-attribution
  pull_request:
    paths:
      - 'experiments/a1h_*.py'
      - 'experiments/run_a1h_hierarchical_memory.py'
      - 'tests/test_a1h_hierarchical_memory.py'
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test deps
        run: python -m pip install numpy scikit-learn
      - name: Compile new modules
        run: |
          python -m py_compile experiments/a1h_memory.py experiments/a1h_hierarchical_matched.py experiments/a1h_mechanism_test.py experiments/run_a1h_hierarchical_memory.py tests/test_a1h_hierarchical_memory.py
      - name: One-command runner offline self-test
        run: python experiments/run_a1h_hierarchical_memory.py --self-test
      - name: Offline contract regressions
        run: python -m unittest discover -s tests -p 'test_a1h_hierarchical_memory.py' -v
