name: P0/P1 falsification CPU contracts
on:
  push:
    branches: [p0p1-falsification-20261028]
  pull_request:
    paths:
      - 'experiments/risk_safe/p01_*.py'
      - 'tests/test_risk_safe_p01.py'
      - '.github/workflows/p01-falsification.yml'
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile checks (no CUDA)
        run: python -m py_compile experiments/risk_safe/p01_falsification_core.py experiments/risk_safe/p01_falsification_native.py tests/test_risk_safe_p01.py
      - name: Calibration and admission selection contract tests
        run: python -m unittest discover -s tests -p 'test_risk_safe_p01.py' -v
